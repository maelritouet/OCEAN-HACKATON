version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Permet le hot-reload de ton code Python sans rebuild l'image
      - ./backend:/app
    environment:
      - NC_FILE_PATH=data/copernicus_sst.nc

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"